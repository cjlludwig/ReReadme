name: README CI Suggestions

on:
  pull_request:
    branches:
      - main

jobs:
  readme-suggestions:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Analyze diff and generate README suggestions
        run: npm run dev -- --ci --base-ref origin/main --head-ref HEAD
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post suggestions as PR comment
        if: hashFiles('README-suggestions.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('README-suggestions.md', 'utf8').trim()
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body
            })
