name: Validate Install & CLI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: evals/uv.lock

      - run: npm ci --prefer-offline --no-audit --fund=false

      - run: npm install -g markdownlint-cli

      - run: cd evals && uv sync --locked

      - name: Static quality gate
        run: make check

      - name: Unit tests
        run: make test

      - name: Build (compile dist/ before linking the CLI)
        run: npm run build

      - run: npm link

      - name: Validate rereadme --help
        run: rereadme --help

      - name: Validate rereadme --check
        run: rereadme --check
        env:
          OPENAI_API_KEY: foo

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci --prefer-offline --no-audit --fund=false

      - name: Pack and install from tarball
        run: |
          npm pack
          npm install -g ./cjlludwig-rereadme-*.tgz

      - name: Smoke test CLI
        run: rereadme --help
        env:
          OPENAI_API_KEY: foo
