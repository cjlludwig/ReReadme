name: Validate Install & CLI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm install -g markdownlint-cli

      - run: npm link

      - name: Validate rereadme --help
        run: rereadme --help

      - name: Validate rereadme --check
        run: rereadme --check
        env:
          OPENAI_API_KEY: foo

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Pack and install from tarball
        run: |
          npm pack
          npm install -g ./cjlludwig-rereadme-*.tgz

      - name: Smoke test CLI
        run: rereadme --help
        env:
          OPENAI_API_KEY: foo
