name: cjlludwig rereadme
description: Analyze PR diffs and suggest README updates
inputs:
  openai-api-key:
    required: true
    description: key
  base-ref:
    default: origin/main
    description: Base branch to compare against. Defaults to origin/main. Variants may be origin/master, origin/prod, etc.
  verbose:
    default: "false"
    description: Enable verbose agent trace output for debugging. Options 'true' || 'false'
  model:
    description: Override the default model (e.g. gpt-4o). Omit to use the built-in default.
branding:
  icon: file-text
  color: blue
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
    - uses: actions/github-script@v7
      id: lock-hash
      with:
        script: |
          const crypto = require('crypto')
          const fs = require('fs')
          const path = require('path')
          const lockFile = path.join(process.env.GITHUB_ACTION_PATH, 'package-lock.json')
          return crypto.createHash('sha256').update(fs.readFileSync(lockFile)).digest('hex')
        result-encoding: string
    - uses: actions/cache@v4
      id: node-cache
      with:
        path: ${{ github.action_path }}/node_modules
        key: ${{ runner.os }}-rereadme-node-${{ steps.lock-hash.outputs.result }}
        restore-keys: ${{ runner.os }}-rereadme-node-
    - run: npm ci
      if: steps.node-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
    - run: node ${{ github.action_path }}/bin/rereadme.js --ci --base-ref ${{ inputs.base-ref }} --head-ref HEAD ${{ inputs.verbose == 'true' && '--verbose' || '' }} ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
    - if: hashFiles('README-suggestions.md') != ''
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- rereadme-agent -->'
          const fs = require('fs')
          const body = `${marker}\n${fs.readFileSync('README-suggestions.md', 'utf8').trim()}`
          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo, issue_number: context.issue.number
          })
          const existing = comments.find(c => c.body?.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
          }
