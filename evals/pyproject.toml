[project]
name = "rereadme-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=1.0.0",
    "pytest>=7.0.0",
]

[dependency-groups]
dev = ["ruff>=0.9.0", "mypy>=1.14.0", "deptry>=0.22.0"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["datasets/"]
